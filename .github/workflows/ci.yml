name: ci

on:
  # 只有 main 的推送才直接跑：**PR 分支的推送会同时触发 push 与 pull_request 两个事件**，
  # 于是同一份工作白跑两遍（实测：每个 run 的 powershell job 都要 20~30 分钟，白跑一遍很贵）。
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.engine }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pwsh, powershell]

    steps:
      # v4 基于 Node 20，跑在 Node 24 的 runner 上会报弃用告警（Annotations 里那两条）；
      # v7 是当前大版本（Node 24）。仍按大版本号引用，跟随官方的安全补丁。
      - uses: actions/checkout@v7

      - name: Show engine versions
        shell: pwsh
        run: |
          Write-Output "harness engine: $($PSVersionTable.PSVersion)"
          & ${{ matrix.engine }} -NoProfile -Command 'Write-Output "target engine: $($PSVersionTable.PSVersion)"'

      # 同一份脚本必须在 5.1 与 7.x 下都通过（AGENTS.md 的验收标准）。
      # SLOW_TESTS=1 启用慢速集成测试（真跑一次完整体检，约 2 分钟/引擎）：
      # 本地默认跳过以保持迭代速度，CI 上必须跑。
      - name: Run test suite on ${{ matrix.engine }}
        shell: pwsh
        env:
          SLOW_TESTS: '1'
        # 注意：**不要**把上面写成 `shell: ${{ matrix.engine }}` —— GitHub Actions 在**解析期**
          # 就拒绝带表达式的 shell，整条工作流会以 "workflow file issue" 启动失败（0 个 job、无日志）。
          # 所以 shell 固定 pwsh，改由这里显式调用矩阵指定的引擎 —— 目的同样是让 run-tests.ps1
          # **自己**也跑在该引擎下，而不是"用 pwsh 主持、只让子进程用 5.1"。
        run: |
          & ${{ matrix.engine }} -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests.ps1 -Engine ${{ matrix.engine }}
          $rc = $LASTEXITCODE
          if ($null -eq $rc) { throw '被调用的引擎没有返回退出码 —— 视为失败' }
          exit $rc

      # 测试是只读的：跑完仓库必须干净。这条能抓出"测试偷偷改了工作区"（比如自动补 BOM）。
      - name: Assert the tests did not modify the checkout
        shell: pwsh
        run: |
          git status --porcelain
          if (git status --porcelain) { throw 'tests modified the repository (they must be read-only)' }
